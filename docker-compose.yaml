version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ./.env
    environment:
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_ROOT_PASSWORD: "${DB_PASS}"
    ports:
      - "${DB_PORT}:3306"
    networks:
      - app-network
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    env_file: ./.env
    environment:
      PMA_ARBITRARY: 1
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks:
      - app-network

  nats:
    image: nats:2.12.0
    restart: unless-stopped
    ports:
      - "${NATS_LOCAL_PORT}:${NATS_DOCKER_PORT}"
      - "${NATS_MONITOR_LOCAL_PORT}:${NATS_MONITOR_DOCKER_PORT}"
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: minio_server
    restart: unless-stopped
    env_file: ./.env
    ports:
      - "${MINIO_API_PORT}:9000"    # API
      - "${MINIO_CONSOLE_PORT}:9001" # Web Console
    command: server /data --console-address ":9001"
    networks:
      - app-network
    volumes:
      - minio_data:/data
  backend:
    image: ghcr.io/telemondo-technologies-development/gms-backend-spring:dev
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_CONTAINER_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASS: "${DB_PASS}"

      MINIO_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD}"
      # Some Spring configs bind accessKey/secretKey as a single token (accesskey)
      # rather than two tokens (access.key) when reading from env vars.
      MINIO_ACCESSKEY: "${MINIO_ROOT_USER}"
      MINIO_SECRETKEY: "${MINIO_ROOT_PASSWORD}"

      NATS_URL: "nats://nats:${NATS_DOCKER_PORT}"
      SPRING_PROFILES_ACTIVE: dev

    depends_on:
      - mysql
      - nats
      - minio
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db:
  minio_data: